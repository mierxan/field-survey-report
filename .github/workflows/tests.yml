# The automated tests that do not open the program's window, on every push
# and pull request. The window tests (-m gui) need a desktop and are run
# on the PC with RUN_TESTS.bat. The tests against the real test database
# are skipped here (no MySQL), and say so.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the pinned packages
        run: python -m pip install -r requirements-dev.txt

      - name: Check the code (ruff)
        run: python -m ruff check .

      - name: Tests without the window
        env:
          FSR_SECRET_STORE: memory
        run: python -m pytest -q -rs -m "not gui"
